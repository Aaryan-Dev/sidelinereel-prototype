# Builds the API image from the repository root and pushes it to Artifact Registry.
#   gcloud builds submit --config cloudbuild.yaml --project <project> .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/sidelinereel/api:latest
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/sidelinereel/api:latest
options:
  logging: CLOUD_LOGGING_ONLY
